<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reverse Video Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1420;
    --panel:#161D2E;
    --panel-alt:#1D2540;
    --border:#2A3350;
    --text:#EDEFF4;
    --text-dim:#8891A6;
    --gold:#D4A73C;
    --teal:#4FA8A0;
    --brick:#C4574B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans',sans-serif;
    min-height:100vh;
  }
  #app{max-width:960px;margin:0 auto;padding:28px 20px 60px;}

  .ticker{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:4px;
    padding:12px 18px;
    margin-bottom:22px;
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    letter-spacing:.02em;
    flex-wrap:wrap;
    gap:10px;
  }
  .ticker .brand{color:var(--gold);font-weight:600;}
  .ticker .scores{display:flex;gap:18px;color:var(--text-dim);}
  .ticker .scores b{color:var(--text);font-weight:600;}

  h1{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    letter-spacing:-0.01em;
    margin:0 0 6px;
  }
  .sub{color:var(--text-dim);margin:0 0 26px;font-size:15px;line-height:1.5;max-width:60ch;}

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:22px;
    margin-bottom:18px;
  }
  .panel h2{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--gold);
    margin:0 0 16px;
    font-weight:600;
  }

  label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:5px;}
  input[type=text],input[type=number],textarea{
    width:100%;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:4px;
    padding:9px 11px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:14px;
  }
  input:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px;}
  textarea{resize:vertical;min-height:56px;}

  .row{display:flex;gap:14px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:180px;}

  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    font-weight:600;
    letter-spacing:.02em;
    border-radius:4px;
    padding:10px 18px;
    cursor:pointer;
    border:1px solid var(--border);
    background:var(--panel-alt);
    color:var(--text);
    transition:border-color .15s ease, transform .1s ease;
  }
  button:hover{border-color:var(--gold);}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--gold);color:#191305;border-color:var(--gold);}
  button.primary:hover{border-color:var(--gold);filter:brightness(1.08);}
  button.ghost{background:transparent;}
  button.danger{color:var(--brick);}

  .round-card{
    border:1px solid var(--border);
    border-radius:5px;
    padding:14px;
    margin-bottom:12px;
    background:var(--panel-alt);
  }
  .round-card .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .round-card .head span{font-family:'IBM Plex Mono',monospace;color:var(--text-dim);font-size:12px;}
  .round-card .fields{display:grid;gap:10px;}

  .video-frame{
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
    background:#000;
    position:relative;
    margin-bottom:16px;
  }
  .video-frame::before{
    content:attr(data-tag);
    position:absolute;top:8px;left:8px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.08em;
    background:rgba(0,0,0,.65);
    color:var(--gold);
    padding:3px 7px;border-radius:3px;
    z-index:2;
  }
  .video-frame video, .video-frame iframe{
    width:100%;
    display:block;
    aspect-ratio:16/9;
    background:#000;
  }

  .timer-wrap{margin-bottom:18px;}
  .timer-labels{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
  .timer-bar{height:8px;border-radius:4px;background:var(--panel-alt);border:1px solid var(--border);overflow:hidden;}
  .timer-fill{height:100%;background:var(--teal);transition:width 1s linear, background .3s ease;}
  .timer-fill.low{background:var(--brick);}

  .guess-block{border:1px solid var(--border);border-radius:5px;padding:14px;margin-bottom:12px;background:var(--panel-alt);}
  .guess-block .team-name{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--gold);margin-bottom:8px;font-weight:600;}
  .guess-block .locked{color:var(--text-dim);font-size:13px;font-style:italic;}
  .guess-row{display:flex;gap:8px;}
  .guess-row textarea{flex:1;}

  .reveal-prompt{
    border-left:3px solid var(--gold);
    padding:10px 14px;
    background:var(--panel-alt);
    border-radius:0 4px 4px 0;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.5;
  }
  .score-line{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--border);
    padding:10px 0;
    gap:12px;
  }
  .score-line:last-child{border-bottom:none;}
  .score-line .pts{font-family:'IBM Plex Mono',monospace;color:var(--teal);font-weight:600;font-size:15px;white-space:nowrap;}
  .score-line .fb{color:var(--text-dim);font-size:13px;}

  .footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}

  .leaderboard{display:grid;gap:10px;margin-bottom:18px;}
  .lb-row{
    display:flex;justify-content:space-between;align-items:center;
    border:1px solid var(--border);border-radius:5px;
    padding:12px 16px;background:var(--panel-alt);
  }
  .lb-row.winner{border-color:var(--gold);}
  .lb-row .name{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .lb-row .pts{font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--gold);}
  .crown{color:var(--gold);margin-right:8px;}

  .hint{font-size:12px;color:var(--text-dim);margin-top:8px;line-height:1.5;}
  .badge{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;
    padding:2px 7px;border-radius:3px;border:1px solid var(--border);color:var(--text-dim);
  }
  .status-msg{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--text-dim);margin:10px 0;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- State ---------- */
let state = {
  screen: 'setup', // setup | round | reveal | results
  teams: ['Team A', 'Team B'],
  timerSeconds: 60,
  rounds: [
    {
      videoUrl: 'https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
      prompt: 'DEMO ROUND — replace this with a real AI-generated clip URL and its exact source prompt before running the session.',
      tag: 'DEMO'
    },
    {
      videoUrl: 'https://storage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4',
      prompt: 'DEMO ROUND — replace this with a real AI-generated clip URL and its exact source prompt before running the session.',
      tag: 'DEMO'
    }
  ],
  currentRound: 0,
  scores: [],       // running totals per team
  guesses: [],       // guesses[roundIndex][teamIndex] = string
  revealResults: null, // {scores:[{points,feedback}], } for current round
  timeLeft: 0,
  timerHandle: null
};

/* ---------- Helpers ---------- */
function isYouTube(url){
  return /youtube\.com|youtu\.be/i.test(url);
}
function youTubeEmbed(url){
  let id = '';
  const m1 = url.match(/[?&]v=([^&]+)/);
  const m2 = url.match(/youtu\.be\/([^?&]+)/);
  if (m1) id = m1[1]; else if (m2) id = m2[1];
  return 'https://www.youtube.com/embed/' + id;
}

function wordOverlapScore(guess, actual){
  const clean = s => (s||'').toLowerCase().replace(/[^a-z0-9\s]/g,'').split(/\s+/).filter(w=>w.length>2);
  const a = new Set(clean(actual));
  const g = clean(guess);
  if (a.size === 0 || g.length === 0) return {score:0, feedback:'Not enough to compare — no strong keyword overlap found.'};
  let hits = 0;
  g.forEach(w => { if (a.has(w)) hits++; });
  const score = Math.round(Math.min(100, (hits / a.size) * 100));
  return {score, feedback:'Scored by keyword overlap (fallback — API scoring unavailable).'};
}

async function scoreGuess(guess, actual){
  if (!guess || !guess.trim()) return {score:0, feedback:'No guess submitted.'};
  try{
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        messages:[{
          role:'user',
          content: 'You are judging a "reverse video challenge" game. A player watched an AI-generated video clip and guessed the text prompt that created it. Compare their guess to the real prompt and score how well they captured the same subject, action, style, and key visual details (not exact wording).\n\nReal prompt: "' + actual.replace(/"/g,'\\"') + '"\nPlayer guess: "' + guess.replace(/"/g,'\\"') + '"\n\nRespond with ONLY a JSON object, no markdown, no preamble, in this exact shape: {"score": <integer 0-100>, "feedback": "<one short sentence, under 20 words, on what they got right or missed>"}'
        }]
      })
    });
    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if (!textBlock) throw new Error('no text block');
    const clean = textBlock.text.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    if (typeof parsed.score !== 'number') throw new Error('bad shape');
    return {score: Math.max(0, Math.min(100, Math.round(parsed.score))), feedback: parsed.feedback || ''};
  }catch(err){
    return wordOverlapScore(guess, actual);
  }
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');

function render(){
  if (state.screen === 'setup') return renderSetup();
  if (state.screen === 'round') return renderRound();
  if (state.screen === 'reveal') return renderReveal();
  if (state.screen === 'results') return renderResults();
}

function renderSetup(){
  const teamsInputs = state.teams.map((t,i) => `
    <div>
      <label>Team ${i+1} name</label>
      <input type="text" value="${escapeAttr(t)}" onchange="updateTeamName(${i}, this.value)">
    </div>
  `).join('');

  const roundsCards = state.rounds.map((r,i) => `
    <div class="round-card">
      <div class="head">
        <span>ROUND ${i+1}${r.tag ? ' · ' + r.tag : ''}</span>
        <button class="ghost danger" onclick="removeRound(${i})">Remove</button>
      </div>
      <div class="fields">
        <div>
          <label>Video URL (direct .mp4 link or YouTube link)</label>
          <input type="text" value="${escapeAttr(r.videoUrl)}" onchange="updateRound(${i}, 'videoUrl', this.value)">
        </div>
        <div>
          <label>Exact source prompt used to generate this clip</label>
          <textarea onchange="updateRound(${i}, 'prompt', this.value)">${escapeHtml(r.prompt)}</textarea>
        </div>
      </div>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="ticker"><span class="brand">REVERSE VIDEO CHALLENGE</span><span class="badge">SETUP</span></div>
    <h1>Reverse Video Challenge</h1>
    <p class="sub">Players watch an AI-generated clip and guess the prompt that created it. Set up your teams and rounds below, then start the challenge.</p>

    <div class="panel">
      <h2>Teams</h2>
      <div class="row">${teamsInputs}</div>
      <div style="margin-top:14px;">
        <button class="ghost" onclick="addTeam()">+ Add team</button>
        ${state.teams.length > 2 ? '<button class="ghost danger" onclick="removeTeam()">Remove last team</button>' : ''}
      </div>
    </div>

    <div class="panel">
      <h2>Timer</h2>
      <div class="row">
        <div>
          <label>Seconds per round</label>
          <input type="number" min="10" step="5" value="${state.timerSeconds}" onchange="state.timerSeconds = parseInt(this.value)||60">
        </div>
      </div>
    </div>

    <div class="panel">
      <h2>Rounds</h2>
      ${roundsCards}
      <button class="ghost" onclick="addRound()">+ Add round</button>
      <p class="hint">The two demo rounds use placeholder stock clips so you can test the flow. Replace the video URL and prompt on each with a real AI-generated clip (from a source like Sora, Runway, Kling or Pika) and the exact prompt used, before running a live session.</p>
    </div>

    <div class="footer-actions">
      <button class="primary" onclick="startGame()" ${state.rounds.length === 0 ? 'disabled' : ''}>Start challenge →</button>
    </div>
  `;
}

function addTeam(){
  if (state.teams.length >= 4) return;
  state.teams.push('Team ' + String.fromCharCode(65 + state.teams.length));
  render();
}
function removeTeam(){
  if (state.teams.length <= 2) return;
  state.teams.pop();
  render();
}
function updateTeamName(i, val){ state.teams[i] = val || state.teams[i]; }

function addRound(){
  state.rounds.push({videoUrl:'', prompt:'', tag:''});
  render();
}
function removeRound(i){ state.rounds.splice(i,1); render(); }
function updateRound(i, field, val){ state.rounds[i][field] = val; }

function startGame(){
  state.scores = state.teams.map(() => 0);
  state.guesses = state.rounds.map(() => state.teams.map(() => ''));
  state.currentRound = 0;
  goToRound();
}

function goToRound(){
  state.screen = 'round';
  state.revealResults = null;
  state.timeLeft = state.timerSeconds;
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(() => {
    state.timeLeft--;
    if (state.timeLeft <= 0){
      clearInterval(state.timerHandle);
      state.timeLeft = 0;
    }
    updateTimerUI();
  }, 1000);
  render();
}

function updateTimerUI(){
  const fill = document.getElementById('timerFill');
  const label = document.getElementById('timerLabel');
  if (!fill || !label) return;
  const pct = Math.max(0, (state.timeLeft / state.timerSeconds) * 100);
  fill.style.width = pct + '%';
  fill.classList.toggle('low', state.timeLeft <= 10);
  label.textContent = String(state.timeLeft).padStart(2,'0') + 's';
}

function renderRound(){
  const r = state.rounds[state.currentRound];
  const scoresStr = state.teams.map((t,i) => t + ': <b>' + state.scores[i] + '</b>').join(' &nbsp;·&nbsp; ');

  const videoHtml = isYouTube(r.videoUrl)
    ? `<iframe src="${escapeAttr(youTubeEmbed(r.videoUrl))}" frameborder="0" allow="autoplay" allowfullscreen></iframe>`
    : `<video src="${escapeAttr(r.videoUrl)}" controls></video>`;

  const guessBlocks = state.teams.map((t,i) => {
    const val = state.guesses[state.currentRound][i];
    const locked = val !== '' && val !== undefined && guessLocked(state.currentRound, i);
    return `
      <div class="guess-block">
        <div class="team-name">${escapeHtml(t)}</div>
        ${locked
          ? `<div class="locked">Guess submitted ✓</div>`
          : `<div class="guess-row">
               <textarea id="guess-${i}" placeholder="Type the prompt you think created this clip...">${escapeHtml(val||'')}</textarea>
               <button onclick="submitGuess(${i})">Submit</button>
             </div>`}
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="ticker">
      <span class="brand">REVERSE VIDEO CHALLENGE</span>
      <span class="scores">${scoresStr}</span>
    </div>
    <h1>Round ${state.currentRound + 1} <span style="color:var(--text-dim);font-weight:400;">of ${state.rounds.length}</span></h1>
    <p class="sub">Watch the clip, then submit your best guess at the exact prompt that generated it.</p>

    <div class="video-frame" data-tag="${r.tag || 'CLIP'}">${videoHtml}</div>

    <div class="timer-wrap">
      <div class="timer-labels"><span>TIME LEFT</span><span id="timerLabel">${String(state.timeLeft).padStart(2,'0')}s</span></div>
      <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:${(state.timeLeft/state.timerSeconds)*100}%"></div></div>
    </div>

    ${guessBlocks}

    <div class="footer-actions">
      <button class="primary" onclick="revealRound()">Reveal prompt & score round →</button>
    </div>
  `;
  updateTimerUI();
}

function guessLocked(roundIdx, teamIdx){
  return !!state.guesses[roundIdx][teamIdx] && state.guesses[roundIdx][teamIdx].__locked;
}

function submitGuess(teamIdx){
  const el = document.getElementById('guess-' + teamIdx);
  const val = el ? el.value : '';
  const wrapped = new String(val);
  wrapped.__locked = true;
  state.guesses[state.currentRound][teamIdx] = wrapped;
  render();
}

async function revealRound(){
  clearInterval(state.timerHandle);
  state.screen = 'reveal';
  state.revealResults = { loading: true };
  render();

  const r = state.rounds[state.currentRound];
  const results = [];
  for (let i = 0; i < state.teams.length; i++){
    const guess = String(state.guesses[state.currentRound][i] || '');
    const res = await scoreGuess(guess, r.prompt);
    results.push(res);
    state.scores[i] += res.score;
  }
  state.revealResults = { loading:false, results };
  render();
}

function renderReveal(){
  const r = state.rounds[state.currentRound];
  const scoresStr = state.teams.map((t,i) => t + ': <b>' + state.scores[i] + '</b>').join(' &nbsp;·&nbsp; ');
  const isLast = state.currentRound === state.rounds.length - 1;

  if (state.revealResults.loading){
    app.innerHTML = `
      <div class="ticker"><span class="brand">REVERSE VIDEO CHALLENGE</span><span class="scores">${scoresStr}</span></div>
      <h1>Scoring round ${state.currentRound + 1}...</h1>
      <p class="status-msg">Comparing each guess against the source prompt...</p>
    `;
    return;
  }

  const lines = state.teams.map((t,i) => {
    const res = state.revealResults.results[i];
    return `
      <div class="score-line">
        <div><strong>${escapeHtml(t)}</strong><div class="fb">${escapeHtml(res.feedback||'')}</div></div>
        <div class="pts">+${res.score}</div>
      </div>
    `;
  }).join('');

  app.innerHTML = `
    <div class="ticker"><span class="brand">REVERSE VIDEO CHALLENGE</span><span class="scores">${scoresStr}</span></div>
    <h1>Round ${state.currentRound + 1} — Revealed</h1>
    <div class="reveal-prompt"><strong>Actual prompt:</strong><br>${escapeHtml(r.prompt)}</div>
    <div class="panel">
      <h2>Round scores</h2>
      ${lines}
    </div>
    <div class="footer-actions">
      <button class="primary" onclick="${isLast ? 'showResults()' : 'nextRound()'}">${isLast ? 'See final results →' : 'Next round →'}</button>
    </div>
  `;
}

function nextRound(){
  state.currentRound++;
  goToRound();
}

function showResults(){
  state.screen = 'results';
  render();
}

function renderResults(){
  const ranked = state.teams.map((t,i) => ({name:t, pts:state.scores[i]}))
    .sort((a,b) => b.pts - a.pts);
  const top = ranked[0].pts;

  const rows = ranked.map(r => `
    <div class="lb-row ${r.pts === top ? 'winner' : ''}">
      <div class="name">${r.pts === top ? '<span class="crown">★</span>' : ''}${escapeHtml(r.name)}</div>
      <div class="pts">${r.pts}</div>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="ticker"><span class="brand">REVERSE VIDEO CHALLENGE</span><span class="badge">FINAL RESULTS</span></div>
    <h1>${escapeHtml(ranked[0].name)} wins</h1>
    <p class="sub">${state.rounds.length} rounds played. Final standings below.</p>
    <div class="leaderboard">${rows}</div>
    <div class="footer-actions">
      <button class="ghost" onclick="resetGame()">Back to setup</button>
    </div>
  `;
}

function resetGame(){
  clearInterval(state.timerHandle);
  state.screen = 'setup';
  state.currentRound = 0;
  state.revealResults = null;
  render();
}

/* ---------- Escaping ---------- */
function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

render();
</script>
</body>
</html>
